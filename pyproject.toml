[project]
name = "wraithd"
version = "0.1.0"
description = "A personal agent that runs on your own machine."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shahar Ishay" }]
requires-python = ">=3.12"
keywords = ["agent", "ai", "llm", "assistant", "daemon", "self-hosted", "mcp", "telegram", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
]
dependencies = [
    "croniter>=6",
    "httpx>=0.28.1",
    "keyring>=25",
    "openai-agents[litellm]>=0.24.0",
    "openpyxl>=3.1",
    "pypdf>=5",
    "pyyaml>=6",
    "tiktoken>=0.14",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "rich>=13",
    "prompt-toolkit>=3.0.40",
]

[project.urls]
Homepage = "https://github.com/shaharishay14/wraithd"
Documentation = "https://github.com/shaharishay14/wraithd/tree/main/docs"
Source = "https://github.com/shaharishay14/wraithd"
Issues = "https://github.com/shaharishay14/wraithd/issues"
Changelog = "https://github.com/shaharishay14/wraithd/releases"

[project.scripts]
wraithd = "wraithd.cli:main"

[project.optional-dependencies]
whisper = [
    "faster-whisper>=1.1",
]
browser = [
    "playwright>=1.48",
]
claude = [
    "claude-agent-sdk>=0.2.177",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build]
# scripts/release.sh builds the web UI into this gitignored folder; without it the daemon shows a placeholder page
artifacts = ["src/wraithd/ui/"]

[tool.hatch.build.targets.sdist]
# Only what builds and tests the package: not the site, the UI's sources and node_modules, research or design
include = ["/src/wraithd", "/tests", "/docs/*.md", "/scripts/release.sh", "/README.md", "/LICENSE", "/uv.lock"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "python-docx>=1.1",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.format]
quote-style = "single"
